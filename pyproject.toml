[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "short-drama-production-control"
version = "0.1.0"
description = "Offline contract and prompt validation for a short-drama production control plane"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

